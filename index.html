<meta name="claude:viewport-fit-sides" content="cover">
<title>Roaring Twenties Jeopardy</title>
<style>
  /* Layout concept: a deco "stage" — gold-bordered board under a marquee title,
     scoreboard rail below. Clue reveals as a full-stage card with a brass-rule frame. */
  :root{
    --bg:#0b1511;
    --surface:#132019;
    --surface-2:#1a2b21;
    --ink:#f3ead9;
    --ink-dim:#c9bfa9;
    --gold:#c9a24b;
    --gold-bright:#e8c874;
    --emerald:#1f4d3d;
    --burgundy:#7a2331;
    --burgundy-bright:#a8364a;
    --focus:#e8c874;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#0b1511; --surface:#132019; --surface-2:#1a2b21;
      --ink:#f3ead9; --ink-dim:#c9bfa9; --gold:#c9a24b; --gold-bright:#e8c874;
      --emerald:#1f4d3d; --burgundy:#7a2331; --burgundy-bright:#a8364a; --focus:#e8c874;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b1511; --surface:#132019; --surface-2:#1a2b21;
    --ink:#f3ead9; --ink-dim:#c9bfa9; --gold:#c9a24b; --gold-bright:#e8c874;
    --emerald:#1f4d3d; --burgundy:#7a2331; --burgundy-bright:#a8364a; --focus:#e8c874;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Josefin Sans', 'Trebuchet MS', sans-serif;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px;
    min-height: 100%;
    background-image:
      radial-gradient(circle at 15% 8%, rgba(201,162,75,0.08), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(122,35,49,0.10), transparent 45%);
  }
  html, body { height: 100%; }

  h1,h2,h3 { text-wrap: balance; margin: 0; }

  .wrap{ max-width: 1180px; margin: 0 auto; display:flex; flex-direction:column; gap:22px; }

  /* ---------- Marquee header ---------- */
  .marquee{
    position: relative;
    text-align:center;
    padding: 22px 12px 18px;
    border: 2px solid var(--gold);
    border-radius: 6px;
    background: linear-gradient(180deg, var(--surface-2), var(--surface));
    box-shadow: 0 0 0 6px var(--bg), 0 0 0 7px rgba(201,162,75,0.35);
  }
  .marquee::before, .marquee::after{
    content:"";
    position:absolute; top:10px; bottom:10px; width: 10px;
    background-image: radial-gradient(circle, var(--gold-bright) 0 2.5px, transparent 3px);
    background-size: 100% 18px;
    opacity:.8;
  }
  .marquee::before{ left:10px; }
  .marquee::after{ right:10px; }
  .eyebrow{
    font-family:'Josefin Sans',sans-serif;
    letter-spacing:.35em; text-transform:uppercase;
    font-size:.72rem; color:var(--gold); margin-bottom:6px;
  }
  .title{
    font-family:'Bebas Neue','Josefin Sans',sans-serif;
    font-size: clamp(2.2rem, 6vw, 3.6rem);
    letter-spacing:.04em;
    color: var(--gold-bright);
    text-shadow: 0 0 18px rgba(232,200,116,0.25);
    line-height:1;
  }
  .subtitle{
    font-family:'Libre Caslon Text', Georgia, serif;
    font-style:italic;
    color: var(--ink-dim);
    margin-top:8px;
    font-size: .98rem;
  }
  .top-controls{
    display:flex; justify-content:center; gap:10px; margin-top:14px; flex-wrap:wrap;
  }

  button{
    font-family:'Josefin Sans',sans-serif;
    font-weight:600;
    letter-spacing:.03em;
    border-radius:4px;
    border: 1.5px solid var(--gold);
    background: transparent;
    color: var(--gold-bright);
    padding: 8px 16px;
    cursor:pointer;
    font-size:.85rem;
    transition: background .15s, color .15s, transform .1s;
  }
  button:hover{ background: var(--gold); color:#1a1208; }
  button:active{ transform: scale(.97); }
  button:focus-visible{ outline: 3px solid var(--focus); outline-offset:2px; }
  button.primary{ background: var(--gold); color:#1a1208; }
  button.primary:hover{ background: var(--gold-bright); }
  button.ghost{ border-color: var(--ink-dim); color: var(--ink-dim); }
  button.ghost:hover{ background: var(--ink-dim); color:#1a1208; }
  button:disabled{ opacity:.4; cursor:default; }
  button:disabled:hover{ background:transparent; color:var(--gold-bright); }

  /* ---------- Scoreboard ---------- */
  .scoreboard{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(190px,1fr));
    gap:12px;
  }
  .team-card{
    background: var(--surface);
    border:1px solid rgba(201,162,75,0.35);
    border-radius:6px;
    padding:12px 14px;
    display:flex; flex-direction:column; gap:6px;
    min-width:0;
  }
  .team-card.active{ border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 14px rgba(201,162,75,0.25); }
  .team-name-row{ display:flex; align-items:center; gap:8px; min-width:0; }
  .team-name{
    background:transparent; border:none; color:var(--gold-bright);
    font-family:'Josefin Sans',sans-serif; font-weight:700; letter-spacing:.03em;
    font-size:.95rem; padding:2px 0; width:100%; min-width:0;
  }
  .team-name:focus-visible{ outline:2px solid var(--focus); border-radius:2px; }
  .team-score{
    font-family:'Bebas Neue',sans-serif; font-size:2rem; letter-spacing:.02em;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .team-score.neg{ color: var(--burgundy-bright); }
  .score-btns{ display:flex; gap:6px; }
  .score-btns button{ flex:1; padding:6px 4px; font-size:.78rem; }

  /* ---------- Board ---------- */
  .board{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap:6px;
  }
  .cat-head{
    background: var(--emerald);
    border: 1px solid var(--gold);
    border-radius: 4px;
    padding: 10px 6px;
    text-align:center;
    font-family:'Bebas Neue',sans-serif;
    letter-spacing:.03em;
    font-size: clamp(.78rem, 2.4vw, 1.05rem);
    color: var(--gold-bright);
    display:flex; align-items:center; justify-content:center;
    min-height: 56px;
    line-height:1.15;
  }
  .tile{
    background: var(--surface-2);
    border: 1px solid rgba(201,162,75,0.4);
    border-radius: 4px;
    min-height: 56px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Bebas Neue',sans-serif;
    font-size: clamp(1rem, 3vw, 1.4rem);
    color: var(--gold);
    cursor:pointer;
    transition: background .12s, transform .12s;
    font-variant-numeric: tabular-nums;
  }
  .tile:hover:not(.used){ background: var(--surface); color: var(--gold-bright); transform: translateY(-2px); }
  .tile.used{ color: rgba(201,162,75,0.18); cursor:default; background: rgba(19,32,25,0.4); }
  .tile:focus-visible{ outline:3px solid var(--focus); outline-offset:-2px; }

  @media (max-width: 640px){
    .board{ grid-template-columns: repeat(5, minmax(56px,1fr)); overflow-x:auto; }
    .cat-head, .tile{ min-height:46px; padding:6px 3px; }
  }

  /* ---------- Clue overlay ---------- */
  .overlay{
    position: fixed; inset:0;
    background: rgba(5,9,7,0.92);
    display:flex; align-items:center; justify-content:center;
    padding: max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));
    z-index: 50;
  }
  .stage{
    width:min(880px, 100%);
    background: linear-gradient(180deg, var(--surface-2), var(--surface));
    border: 2px solid var(--gold);
    border-radius: 8px;
    box-shadow: 0 0 0 6px var(--bg), 0 0 0 7px rgba(201,162,75,0.35);
    padding: 28px clamp(18px,4vw,40px) 26px;
    display:flex; flex-direction:column; gap:18px;
    max-height: 92vh; overflow-y:auto;
  }
  .stage-kicker{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;
    font-family:'Josefin Sans',sans-serif; letter-spacing:.2em; text-transform:uppercase;
    font-size:.75rem; color: var(--gold);
  }
  .timer-bar{ height:6px; border-radius:3px; background: rgba(201,162,75,0.2); overflow:hidden; }
  .timer-fill{ height:100%; background: var(--gold); width:100%; transform-origin:left; }
  .clue-text{
    font-family:'Libre Caslon Text', Georgia, serif;
    font-size: clamp(1.2rem, 3.4vw, 1.75rem);
    line-height:1.4;
    color: var(--ink);
    text-align:center;
    padding: 10px 0;
  }
  .answer-text{
    font-family:'Libre Caslon Text', Georgia, serif;
    font-style:italic;
    font-size: clamp(1.05rem, 2.8vw, 1.4rem);
    color: var(--gold-bright);
    text-align:center;
    border-top: 1px solid rgba(201,162,75,0.35);
    padding-top:16px;
  }
  .stage-actions{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
  .award-row{ display:flex; flex-direction:column; gap:8px; }
  .award-row h3{ font-family:'Josefin Sans',sans-serif; font-size:.78rem; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-dim); text-align:center; }
  .award-grid{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .award-grid button{ min-width:120px; }
  .award-grid button.team-toggle.selected{ background:var(--gold); color:#1a1208; box-shadow:0 0 0 2px var(--gold-bright); }

  .dd-banner{
    text-align:center; font-family:'Bebas Neue',sans-serif; letter-spacing:.06em;
    font-size: clamp(1.6rem,5vw,2.4rem); color: var(--burgundy-bright);
    text-shadow: 0 0 18px rgba(168,54,74,0.4);
  }
  .wager-input{
    font-family:'Bebas Neue',sans-serif; font-size:1.6rem; text-align:center;
    background: var(--surface); border:1.5px solid var(--gold); border-radius:4px;
    color: var(--gold-bright); padding:8px; width: 160px; margin: 0 auto;
    font-variant-numeric: tabular-nums;
  }
  .wager-input:focus-visible{ outline:3px solid var(--focus); }
  .hint{ text-align:center; color:var(--ink-dim); font-size:.85rem; }
  .wager-grid{ display:flex; flex-direction:column; gap:10px; max-width:320px; margin:0 auto 6px; }
  .wager-row{ display:flex; flex-direction:column; gap:5px; }
  .wager-row-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  .wager-row label{ font-family:'Josefin Sans',sans-serif; font-weight:600; color:var(--ink); }
  .wager-row-total{ font-family:'Bebas Neue',sans-serif; font-size:1.1rem; letter-spacing:.02em; color:var(--gold); }
  .wager-row .wager-input{ width:100%; font-size:1.2rem; padding:6px; margin:0; text-align:left; padding-left:12px; }
  .wager-row .wager-input:disabled{ opacity:.4; }
  .wager-row-note{ font-family:'Josefin Sans',sans-serif; font-size:.72rem; color:var(--ink-dim); font-style:italic; }
  .wager-summary{
    text-align:center; font-family:'Josefin Sans',sans-serif; font-size:.82rem; color:var(--ink-dim);
    margin:-6px 0 10px;
  }

  /* ---------- Setup overlay ---------- */
  .setup-card{ width:min(560px,100%); }
  .setup-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .num-teams{ display:flex; gap:8px; }
  .num-teams button.selected{ background:var(--gold); color:#1a1208; }
  .setup-names{ display:flex; flex-direction:column; gap:10px; }
  .setup-names input{
    font-family:'Josefin Sans',sans-serif; font-weight:600; font-size:1rem;
    background: var(--surface); border:1.5px solid rgba(201,162,75,0.4); border-radius:4px;
    color: var(--ink); padding:9px 12px;
  }
  .setup-names input:focus-visible{ outline:3px solid var(--focus); }
  .footer-note{ text-align:center; color:var(--ink-dim); font-size:.78rem; padding-bottom:4px; }
  [hidden]{ display:none !important; }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Josefin+Sans:wght@400;600;700&family=Libre+Caslon+Text:ital@0;1&display=swap" rel="stylesheet">

<div class="wrap">

  <div class="marquee">
    <div class="eyebrow">U.S. History &middot; Unit Review</div>
    <h1 class="title">The Roaring Twenties</h1>
    <p class="subtitle">A Jeopardy&ndash;style review of the Jazz Age &middot; <span id="currentSetLabel">Set 1</span></p>
    <div class="top-controls">
      <button id="btnSound" class="ghost" aria-pressed="true">🔊 Sound On</button>
      <button id="btnNewTeams" class="ghost">New Game / Set</button>
      <button id="btnReset" class="ghost">Reset Board</button>
    </div>
  </div>

  <div class="scoreboard" id="scoreboard"></div>

  <div class="board" id="board"></div>

  <p class="footer-note">Click any tile to reveal a clue. Answers are phrased as questions, just like the show. Two tiles are secretly Daily Doubles.</p>
</div>

<!-- Setup overlay -->
<div class="overlay" id="setupOverlay">
  <div class="stage setup-card">
    <h2 class="title" style="font-size:1.6rem;text-align:center;">Set Up Your Game</h2>
    <div class="setup-row">
      <span style="font-family:'Josefin Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;font-size:.8rem;color:var(--ink-dim);">Question set</span>
      <div class="num-teams" id="setPicker"></div>
    </div>
    <div class="setup-row">
      <span style="font-family:'Josefin Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;font-size:.8rem;color:var(--ink-dim);">Number of teams</span>
      <div class="num-teams" id="numTeams"></div>
    </div>
    <div class="setup-names" id="setupNames"></div>
    <div class="stage-actions">
      <button class="primary" id="btnStart">Start the Game</button>
    </div>
  </div>
</div>

<!-- Clue overlay -->
<div class="overlay" id="clueOverlay" hidden>
  <div class="stage" id="clueStage"></div>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- Game data ---------------- */
  /* Three parallel question sets over the same five categories, so a teacher can
     run the game with different clues across different class periods or retakes
     without students who already played seeing the same answers. */
  var GAME_SETS = [
    { id: "setA", label: "Set 1", categories: [
      { name: "Boom Times", clues: [
        { clue: "Mass-production techniques pioneered by this automaker put the Model T within reach of average Americans.", answer: "Who is Henry Ford?" },
        { clue: "This buying method let families pay a little at a time for radios, cars, and appliances.", answer: "What is installment buying (buying on credit)?" },
        { clue: "Investors used this risky practice of borrowing most of the money to purchase stock.", answer: "What is buying on margin?" },
        { clue: "Warren Harding's 1920 campaign promised a “return” to this, a phrase that became a label for the whole decade's mood.", answer: "What is “normalcy” (a return to normalcy)?" },
        { clue: "1920s Republican economic policy favored this combination of low taxes, little regulation, and pro-business government.", answer: "What is laissez-faire (pro-business) economic policy?" }
      ]},
      { name: "Culture & Harlem", clues: [
        { clue: "This lively, improvised music genre, with roots in New Orleans, gave the decade its nickname.", answer: "What is jazz (the “Jazz Age”)?" },
        { clue: "Young women who bobbed their hair, wore short skirts, and defied traditional norms were known by this name.", answer: "What is a flapper?" },
        { clue: "This Harlem Renaissance poet wrote “The Negro Speaks of Rivers” and “I, Too.”", answer: "Who is Langston Hughes?" },
        { clue: "This 1920s cultural movement, centered in a New York City neighborhood, celebrated African American art, literature, and music.", answer: "What is the Harlem Renaissance?" },
        { clue: "This novelist captured the glamour and disillusionment of the era in “The Great Gatsby.”", answer: "Who is F. Scott Fitzgerald?" }
      ]},
      { name: "Red Scare & Nativism", clues: [
        { clue: "Fear of communist and radical influence after WWI and the Russian Revolution sparked this nationwide panic.", answer: "What is the Red Scare?" },
        { clue: "This 1924 law set strict quotas that sharply limited immigration, especially from southern and eastern Europe.", answer: "What is the Immigration Act of 1924 (National Origins Act)?" },
        { clue: "This white supremacist group saw a major resurgence in the 1920s, spreading beyond the South and targeting Catholics, Jews, and immigrants along with Black Americans.", answer: "What is the Ku Klux Klan?" },
        { clue: "This 1925 Tennessee trial put a teacher on trial for teaching evolution, pitting science against religious fundamentalism.", answer: "What is the Scopes (“Monkey”) Trial?" },
        { clue: "This term describes the decade's preference for native-born Americans and suspicion of immigrants.", answer: "What is nativism?" }
      ]},
      { name: "New Media & Tech", clues: [
        { clue: "This broadcast technology brought news, music, and entertainment directly into American living rooms for the first time.", answer: "What is radio?" },
        { clue: "This aviator became a national hero after his solo nonstop flight across the Atlantic in 1927.", answer: "Who is Charles Lindbergh?" },
        { clue: "Mass production made this invention affordable for ordinary families, reshaping where Americans could live, work, and travel.", answer: "What is the automobile?" },
        { clue: "Silent films gave way to this new kind of movie, starting with “The Jazz Singer” in 1927.", answer: "What is a “talkie” (a talking picture / sound film)?" },
        { clue: "New electric appliances like this one cut hours of hand-washing laundry out of a homemaker's week.", answer: "What is the washing machine?" }
      ]},
      { name: "Key Vocabulary", clues: [
        { clue: "The movement of hundreds of thousands of Black Americans from the rural South to Northern cities in the early 1900s.", answer: "What is the Great Migration?" },
        { clue: "This way of building a car moved the product past a row of workers who each performed one single job.", answer: "What is an assembly line?" },
        { clue: "These laws banned the making, selling, and moving of alcohol across the United States beginning in January 1920.", answer: "What is Prohibition?" },
        { clue: "A person who puts money into a business, like the 1920s aviation industry, hoping to earn more in return.", answer: "What is an investor?" },
        { clue: "This art style broke from old rules and used bold, simple shapes; Aaron Douglas blended it with African art traditions.", answer: "What is modernism?" }
      ]}
    ]},
    { id: "setB", label: "Set 2", categories: [
      { name: "Boom Times", clues: [
        { clue: "Many Americans invested heavily in this financial market during the decade, often borrowing to do so.", answer: "What is the stock market?" },
        { clue: "This term describes the dramatic rise in spending on radios, cars, and appliances that defined the decade's economy.", answer: "What is consumerism (consumer culture)?" },
        { clue: "This cabinet official, Andrew Mellon, pushed for deep tax cuts that mainly benefited businesses and the wealthy.", answer: "Who is the Secretary of the Treasury?" },
        { clue: "This industry boomed in the 1920s, using new psychological techniques to convince Americans to buy more goods.", answer: "What is advertising?" },
        { clue: "Despite the boom, this sector of the economy struggled all decade with overproduction and falling prices.", answer: "What is agriculture (farming)?" }
      ]},
      { name: "Culture & Harlem", clues: [
        { clue: "This fast, kicking dance craze became a signature symbol of flapper culture in the 1920s.", answer: "What is the Charleston?" },
        { clue: "This trumpet virtuoso and bandleader from New Orleans helped bring jazz to a nationwide audience.", answer: "Who is Louis Armstrong?" },
        { clue: "This 1920 constitutional amendment gave women the right to vote, just as the decade's social attitudes began to shift.", answer: "What is the Nineteenth Amendment?" },
        { clue: "Harlem Renaissance writer Zora Neale Hurston is best known for her fiction and folklore exploring this.", answer: "What is African American (Southern Black) culture and folklore?" },
        { clue: "This term describes the generation of 1920s writers, including Hemingway and Fitzgerald, who felt disillusioned after World War I.", answer: "What is the Lost Generation?" }
      ]},
      { name: "Red Scare & Nativism", clues: [
        { clue: "This U.S. attorney general ordered sweeping 1919–20 raids that rounded up thousands of suspected radicals and immigrants.", answer: "Who is A. Mitchell Palmer (the Palmer Raids)?" },
        { clue: "These two Italian immigrant anarchists were controversially convicted and executed in 1927, in a case many believed was driven by anti-immigrant bias.", answer: "Who are Sacco and Vanzetti?" },
        { clue: "This now-discredited belief, that certain racial or ethnic groups were biologically superior, helped fuel support for immigration restriction.", answer: "What is eugenics (scientific racism)?" },
        { clue: "This former presidential candidate led the prosecution against Clarence Darrow in the 1925 Scopes evolution trial.", answer: "Who is William Jennings Bryan?" },
        { clue: "This 1921 law set the first numerical immigration quotas, before being tightened further in 1924.", answer: "What is the Emergency Quota Act (Immigration Act of 1921)?" }
      ]},
      { name: "New Media & Tech", clues: [
        { clue: "This new mass entertainment industry, built around ornate theaters and movie stars, exploded in popularity in the 1920s.", answer: "What is the movie industry (Hollywood)?" },
        { clue: "This household utility, now wired into millions more homes, powered the radios and appliances families bought in the decade.", answer: "What is electricity?" },
        { clue: "Babe Ruth became a national celebrity in this sport, helped along by new radio broadcasts of games.", answer: "What is baseball?" },
        { clue: "Charles Lindbergh's single-engine plane, famous for his 1927 transatlantic flight, carried this name.", answer: "What is the Spirit of St. Louis?" },
        { clue: "Assembly-line production and new paved roads combined to make this form of travel possible for ordinary families.", answer: "What is automobile (car) travel?" }
      ]},
      { name: "Key Vocabulary", clues: [
        { clue: "Farming someone else's land and paying rent with most of your own crop, a system that often kept Southern families poor and in debt.", answer: "What is sharecropping?" },
        { clue: "Making products in the same sizes with the same parts, so any piece fits any machine.", answer: "What is standardization?" },
        { clue: "A now-discredited belief that a government could improve its people by controlling who was allowed to have children.", answer: "What is eugenics?" },
        { clue: "The business and science of flying airplanes, an industry that grew fast in the 1920s and hired pilots, mechanics, and factory workers.", answer: "What is aviation?" },
        { clue: "A performer who stands out alone; Louis Armstrong is said to have changed jazz into this kind of art.", answer: "What is a soloist?" }
      ]}
    ]},
    { id: "setC", label: "Set 3", categories: [
      { name: "Boom Times", clues: [
        { clue: "This nickname for the decade, celebrating its booming economy and wild social changes, is also the name of this very game.", answer: "What are “the Roaring Twenties”?" },
        { clue: "Department stores and mail-order catalogs expanded rapidly in the 1920s, reflecting this broader shift toward buying more goods.", answer: "What is consumerism (mass consumption)?" },
        { clue: "This retail innovation, with name-brand items pre-wrapped on open shelves for shoppers to browse themselves, spread rapidly in the decade.", answer: "What is the self-service grocery store?" },
        { clue: "President Calvin Coolidge, who succeeded Harding, was known for this hands-off governing philosophy that favored business with minimal interference.", answer: "What is “the business of America is business” (pro-business, laissez-faire government)?" },
        { clue: "This 1920s tax policy, championed by Treasury Secretary Mellon, slashed top income tax rates for the wealthy.", answer: "What are Mellon's tax cuts (supply-side/trickle-down tax policy)?" }
      ]},
      { name: "Culture & Harlem", clues: [
        { clue: "This Harlem Renaissance philosopher and editor compiled the influential 1925 anthology “The New Negro” and is often called the movement's father.", answer: "Who is Alain Locke?" },
        { clue: "This famous Harlem ballroom was known for integrated audiences enjoying jazz and swing dancing all night long.", answer: "What is the Savoy Ballroom?" },

  /* ---------------- Sound (Web Audio, synthesized) ---------------- */
  var AudioCtx = window.AudioContext || window.webkitAudioContext;
  var actx = null;
  var soundOn = true;
  function ctx(){ if(!actx && AudioCtx){ try{ actx = new AudioCtx(); }catch(e){ actx = null; } } return actx; }
  function tone(freq, start, dur, type, gain){
    var c = ctx(); if(!c || !soundOn) return;
    try{
      var osc = c.createOscillator(); var g = c.createGain();
      osc.type = type || "sine"; osc.frequency.value = freq;
      g.gain.value = 0;
      osc.connect(g); g.connect(c.destination);
      var t0 = c.currentTime + start;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(gain || 0.18, t0 + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    }catch(e){}
  }
  function sfxSelect(){ tone(740,0,0.12,"triangle",0.15); tone(988,0.05,0.14,"triangle",0.13); }
  function sfxCorrect(){ tone(523.25,0,0.14,"sine",0.18); tone(659.25,0.1,0.16,"sine",0.18); tone(784,0.2,0.26,"sine",0.2); }
  function sfxWrong(){ tone(196,0,0.22,"sawtooth",0.16); tone(174.6,0.14,0.3,"sawtooth",0.16); }
  function sfxTick(){ tone(1046,0,0.045,"square",0.06); }
  function sfxTimeUp(){ tone(220,0,0.3,"sawtooth",0.18); tone(174.6,0.12,0.35,"sawtooth",0.18); }
  function sfxDailyDouble(){
    var notes=[392,523.25,659.25,784,987.77];
    for(var i=0;i<notes.length;i++){ tone(notes[i], i*0.12, 0.3, "triangle", 0.2); }
  }
  function sfxWin(){ var notes=[523.25,659.25,784,1046.5]; for(var i=0;i<notes.length;i++){ tone(notes[i], i*0.1, 0.4, "sine", 0.2); } }

  /* "Thinking music" — an original suspense ostinato (not a reproduction of any
     copyrighted theme). A plucked bell tone plus a soft clock-tick, looping under
     a 16-step minor-key phrase that starts slow and quiet and builds in tempo and
     volume as the clue timer runs down (driven by setThinkProgress, 0 → 1). */
  function pluckTone(freq, start, dur, gain){
    var c = ctx(); if(!c || !soundOn || !freq) return;
    try{
      var t0 = c.currentTime + start;
      var osc1 = c.createOscillator(), g1 = c.createGain();
      osc1.type = "triangle"; osc1.frequency.value = freq;
      osc1.connect(g1); g1.connect(c.destination);
      g1.gain.setValueAtTime(0, t0);
      g1.gain.linearRampToValueAtTime(gain, t0 + 0.012);
      g1.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc1.start(t0); osc1.stop(t0 + dur + 0.02);

      var osc2 = c.createOscillator(), g2 = c.createGain();
      osc2.type = "sine"; osc2.frequency.value = freq * 2;
      osc2.connect(g2); g2.connect(c.destination);
      g2.gain.setValueAtTime(0, t0);
      g2.gain.linearRampToValueAtTime(gain * 0.32, t0 + 0.008);
      g2.gain.exponentialRampToValueAtTime(0.0001, t0 + dur * 0.55);
      osc2.start(t0); osc2.stop(t0 + dur * 0.55 + 0.02);
    }catch(e){}
  }
  function clockTick(gain){ tone(1800, 0, 0.025, "square", gain); }

  var THINK_MELODY = [ // original 16-step minor-key phrase (rests as null)
    392.00, null,   349.23, 392.00,  440.00, null,   392.00, 349.23,
    329.63, null,   349.23, 392.00,  440.00, 493.88, 440.00, null
  ];
  var thinkTimeoutId = null;
  var thinkStep = 0;
  var thinkProgress = 0; // 0 at clue start, 1 as time expires
  function setThinkProgress(p){ thinkProgress = Math.max(0, Math.min(1, p)); }
  function scheduleThink(){
    var interval = 520 - thinkProgress * 320;   // 520ms -> 200ms
    var noteGain = 0.10 + thinkProgress * 0.12;  // 0.10 -> 0.22, audible from the first note
    var tickGain = 0.045 + thinkProgress * 0.06; // 0.045 -> 0.105
    var dur = Math.max(0.14, (interval / 1000) * 0.9);
    var freq = THINK_MELODY[thinkStep % THINK_MELODY.length];
    if(freq) pluckTone(freq, 0, dur, noteGain);
    clockTick(tickGain);
    thinkStep++;
    thinkTimeoutId = setTimeout(scheduleThink, interval);
  }
  function startThinkingMusic(){ stopThinkingMusic(); thinkStep = 0; thinkProgress = 0; scheduleThink(); }
  function stopThinkingMusic(){ if(thinkTimeoutId){ clearTimeout(thinkTimeoutId); thinkTimeoutId = null; } }

  /* ---------------- State ---------------- */
  var state = {
    teams: [ {name:"Team 1", score:0}, {name:"Team 2", score:0} ],
    activeTeam: 0,
    used: {},          // key "c-v" -> true
    dailyDoubles: [],  // array of keys
    started: false,
    setId: "setA"
  };

  function storageSafeGet(key){
    try{ var v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }catch(e){ return null; }
  }
  function storageSafeSet(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
  }

  function pickDailyDoubles(){
    var keys = [];
    for(var c=0;c<CATEGORIES.length;c++){ for(var v=0;v<VALUES.length;v++){ keys.push(c+"-"+v); } }
    // avoid $100 row for a touch of realism
    var pool = keys.filter(function(k){ return k.split("-")[1] !== "0"; });
    var chosen = [];
    while(chosen.length < 2 && pool.length){
      var idx = Math.floor(Math.random()*pool.length);
      chosen.push(pool.splice(idx,1)[0]);
    }
    return chosen;
  }

  /* ---------------- Rendering: scoreboard ---------------- */
  var scoreboardEl = document.getElementById("scoreboard");
  function renderScoreboard(){
    scoreboardEl.innerHTML = "";
    state.teams.forEach(function(team, i){
      var card = document.createElement("div");
      card.className = "team-card" + (i===state.activeTeam ? " active" : "");
      var nameRow = document.createElement("div");
      nameRow.className = "team-name-row";
      var nameInput = document.createElement("input");
      nameInput.className = "team-name";
      nameInput.value = team.name;
      nameInput.setAttribute("aria-label","Team "+(i+1)+" name");
      nameInput.addEventListener("change", function(){
        state.teams[i].name = nameInput.value.trim() || ("Team "+(i+1));
        saveState();
        renderScoreboard();
      });
      nameRow.appendChild(nameInput);
      card.appendChild(nameRow);

      var scoreEl = document.createElement("div");
      scoreEl.className = "team-score" + (team.score < 0 ? " neg" : "");
      scoreEl.textContent = "$" + team.score;
      card.appendChild(scoreEl);

      var btnRow = document.createElement("div");
      btnRow.className = "score-btns";
      var minus = document.createElement("button");
      minus.textContent = "−$" + activeClueValue;
      minus.title = "Manually adjust by the value of the clue on screen ($" + activeClueValue + ")";
      minus.addEventListener("click", function(){ adjustScore(i,-activeClueValue); });
      var plus = document.createElement("button");
      plus.textContent = "+$" + activeClueValue;
      plus.title = "Manually adjust by the value of the clue on screen ($" + activeClueValue + ")";
      plus.addEventListener("click", function(){ adjustScore(i,activeClueValue); });
      var turn = document.createElement("button");
      turn.textContent = "Turn";
      turn.className = "ghost";
      turn.addEventListener("click", function(){ state.activeTeam = i; saveState(); renderScoreboard(); });
      btnRow.appendChild(minus); btnRow.appendChild(plus); btnRow.appendChild(turn);
      card.appendChild(btnRow);

      scoreboardEl.appendChild(card);
    });
  }
  function adjustScore(i, delta){
    state.teams[i].score += delta;
    saveState();
    renderScoreboard();
  }

  /* ---------------- Rendering: board ---------------- */
  var boardEl = document.getElementById("board");
  function renderBoard(){
    boardEl.innerHTML = "";
    CATEGORIES.forEach(function(cat){
      var head = document.createElement("div");
      head.className = "cat-head";
      head.textContent = cat.name;
      boardEl.appendChild(head);
    });
    for(var v=0; v<VALUES.length; v++){
      for(var c=0; c<CATEGORIES.length; c++){
        var key = c+"-"+v;
        var tile = document.createElement("div");
        var used = !!state.used[key];
        tile.className = "tile" + (used ? " used" : "");
        tile.textContent = used ? "" : ("$"+VALUES[v]);
        tile.tabIndex = used ? -1 : 0;
        tile.setAttribute("role","button");
        tile.setAttribute("aria-label", used ? "Used clue" : (CATEGORIES[c].name + " for $" + VALUES[v]));
        (function(c,v,key,tile){
          function activate(){
            if(state.used[key]) return;
            sfxSelect();
            openClue(c,v,key);
          }
          tile.addEventListener("click", activate);
          tile.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); activate(); } });
        })(c,v,key,tile);
        boardEl.appendChild(tile);
      }
    }
  }

  /* ---------------- Clue overlay ---------------- */
  var clueOverlay = document.getElementById("clueOverlay");
  var clueStage = document.getElementById("clueStage");
  var timerInterval = null;
  // Drives the manual +/- buttons on each team card, so a manual correction
  // matches whichever clue's dollar value is currently on screen instead of
  // a flat, unrelated $100.
  var activeClueValue = 100;
  function setActiveClueValue(v){ activeClueValue = v; renderScoreboard(); }
  function resetActiveClueValue(){ activeClueValue = 100; renderScoreboard(); }

  function clearTimer(){
    if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }

  }

  function closeClue(){
    clearTimer();
    clueOverlay.hidden = true;

  function openClue(c, v, key){
    var isDD = state.dailyDoubles.indexOf(key) !== -1;
    var data = CATEGORIES[c].clues[v];
    var value = VALUES[v];
    setActiveClueValue(value);

    if(isDD){
      renderDailyDoubleWager(c,v,key,data,value);
    } else {
      renderClueCard(c,v,key,data,value,value);
    }
    clueOverlay.hidden = false;
  }

  function renderDailyDoubleWager(c,v,key,data,baseValue){
    sfxDailyDouble();
    clearTimer();
    var rows = state.teams.map(function(team, i){
      var maxWager = Math.max(team.score, 0);
      var minWager = maxWager > 0 ? 1 : 0;
      var def = maxWager > 0 ? Math.min(Math.max(baseValue, minWager), maxWager) : 0;
      var disabled = maxWager > 0 ? '' : ' disabled';
      return '<div class="wager-row">' +
        '<div class="wager-row-head">' +
          '<label for="wagerInput'+i+'">' + escapeHtml(team.name) + '</label>' +
          '<span class="wager-row-total">$' + team.score + '</span>' +
        '</div>' +
        '<input class="wager-input" id="wagerInput'+i+'" type="number" inputmode="numeric" min="'+minWager+'" max="'+maxWager+'" step="1" value="'+def+'"' + disabled + ' aria-label="'+escapeHtml(team.name)+' wager amount" data-max="'+maxWager+'" data-min="'+minWager+'">' +
        (maxWager === 0 ? '<span class="wager-row-note">No points to wager yet</span>' : '') +
      '</div>';
    }).join('');
    clueStage.innerHTML =
      '<div class="dd-banner">DAILY DOUBLE</div>' +
      '<p class="hint">Every team can wager on this one, up to their own total. Set each team&rsquo;s wager, then lock them in.</p>' +
      '<div class="wager-grid">' + rows + '</div>' +
      '<div class="stage-actions"><button class="primary" id="wagerGo">Lock In Wagers</button></div>';
    clueStage.querySelector("#wagerGo").addEventListener("click", function(){
      var wagers = {};
      state.teams.forEach(function(team, i){
        var input = clueStage.querySelector("#wagerInput"+i);
        var maxWager = parseInt(input.getAttribute("data-max"), 10);
        var minWager = parseInt(input.getAttribute("data-min"), 10);
        var w = parseInt(input.value, 10);
        if(isNaN(w) || w < minWager) w = minWager;
        if(w > maxWager) w = maxWager;
        wagers[i] = w;
      });
      renderClueCard(c,v,key,data,baseValue,wagers,true);
    });
  }

  function renderClueCard(c,v,key,data,baseValue,pointValueOrWagers,isDD){
    clearTimer();
    var timeLimit = 20;
    var startTime = Date.now();
    var wagers = isDD ? pointValueOrWagers : null;
    var pointValue = isDD ? null : pointValueOrWagers;

    var kickerHtml = isDD
      ? '<div class="stage-kicker"><span>' + escapeHtml(CATEGORIES[c].name) + ' &middot; DAILY DOUBLE</span></div>' +
        '<div class="wager-summary">' + state.teams.map(function(t,i){ return escapeHtml(t.name)+': $'+wagers[i]; }).join(' &middot; ') + '</div>'
      : '<div class="stage-kicker"><span>' + escapeHtml(CATEGORIES[c].name) + '</span><span>$' + pointValue + '</span></div>';

    clueStage.innerHTML =
      kickerHtml +
      '<div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>' +
      '<div class="clue-text">' + escapeHtml(data.clue) + '</div>' +
      '<div class="answer-text" id="answerText" hidden>' + escapeHtml(data.answer) + '</div>' +
      '<div class="stage-actions" id="stageActions">' +
        '<button class="primary" id="btnReveal">Reveal Answer</button>' +
        '<button class="ghost" id="btnSkip">Close (No Score)</button>' +
      '</div>' +
      '<div class="award-row" id="awardRow" hidden>' +
        '<h3>' + (isDD ? 'Tap every team that answered correctly, then award wagers' : 'Tap every team that got it right, then award points') + '</h3>' +
        '<div class="award-grid" id="awardGrid"></div>' +
      '</div>';

    var fill = clueStage.querySelector("#timerFill");
    var secondsLeft = timeLimit;
    startThinkingMusic();
    timerInterval = setInterval(function(){
      secondsLeft -= 1;
      var pct = Math.max(0, secondsLeft/timeLimit*100);
      fill.style.width = pct + "%";
      setThinkProgress((timeLimit - secondsLeft) / timeLimit);
      if(secondsLeft <= 5 && secondsLeft > 0) sfxTick();
      if(secondsLeft <= 0){
        clearTimer();
        sfxTimeUp();
      }
    }, 1000);

    clueStage.querySelector("#btnReveal").addEventListener("click", function(){
      clearTimer();
      clueStage.querySelector("#answerText").hidden = false;
      clueStage.querySelector("#stageActions").hidden = true;
      var awardRow = clueStage.querySelector("#awardRow");
      awardRow.hidden = false;
      var grid = clueStage.querySelector("#awardGrid");
      grid.innerHTML = "";

      if(isDD){
        // Daily Double: every team wagered, so the teacher taps each team
        // that answered correctly. Selected teams win their own wager,
        // every other team loses theirs.
        var ddSelected = {};
        var ddAwardBtn;
        function refreshDDAwardBtn(){
          ddAwardBtn.textContent = "Award Wagers";
        }
        state.teams.forEach(function(team, i){
          var b = document.createElement("button");
          b.textContent = team.name + " ($" + wagers[i] + ")";
          b.className = "team-toggle";
          b.setAttribute("aria-pressed", "false");
          b.addEventListener("click", function(){
            ddSelected[i] = !ddSelected[i];
            b.classList.toggle("selected", !!ddSelected[i]);
            b.setAttribute("aria-pressed", ddSelected[i] ? "true" : "false");
          });
          grid.appendChild(b);
        });
        ddAwardBtn = document.createElement("button");
        ddAwardBtn.className = "primary";
        grid.appendChild(ddAwardBtn);
        refreshDDAwardBtn();
        ddAwardBtn.addEventListener("click", function(){
          markUsed(key);
          var firstSelected = null;
          state.teams.forEach(function(team, i){
            var won = !!ddSelected[i];
            adjustScore(i, won ? wagers[i] : -wagers[i]);
            if(won && firstSelected === null) firstSelected = i;
          });
          if(firstSelected !== null) state.activeTeam = firstSelected;
          sfxCorrect();
          saveState();
          renderBoard();
          closeClue();
        });
        return;
      }

      // Regular clue: let the teacher mark every team that answered
      // correctly (teams can buzz in together on an oral review), then
      // award points to all of them at once.
      var selected = {};
      var awardBtn;
      function refreshAwardBtn(){
        var any = Object.keys(selected).some(function(k){ return selected[k]; });
        awardBtn.disabled = !any;
        awardBtn.textContent = any ? "Award Points to Selected" : "Select a team first";
      }
      state.teams.forEach(function(team, i){
        var b = document.createElement("button");
        b.textContent = team.name;
        b.className = "team-toggle";
        b.setAttribute("aria-pressed", "false");
        b.addEventListener("click", function(){
          selected[i] = !selected[i];
          b.classList.toggle("selected", !!selected[i]);
          b.setAttribute("aria-pressed", selected[i] ? "true" : "false");
          refreshAwardBtn();
        });
        grid.appendChild(b);
      });
      awardBtn = document.createElement("button");
      awardBtn.className = "primary";
      grid.appendChild(awardBtn);
      refreshAwardBtn();
      awardBtn.addEventListener("click", function(){
        markUsed(key);
        var firstSelected = null;
        Object.keys(selected).forEach(function(k){
          if(!selected[k]) return;
          var i = parseInt(k, 10);
          adjustScore(i, pointValue);
          if(firstSelected === null) firstSelected = i;
        });
        if(firstSelected !== null) state.activeTeam = firstSelected;
        sfxCorrect();
        saveState();
        renderBoard();
        closeClue();
      });
      var noneBtn = document.createElement("button");
      noneBtn.className = "ghost";
      noneBtn.textContent = "No one got it";
      noneBtn.addEventListener("click", function(){
        markUsed(key);
        sfxWrong();
        saveState();
        renderBoard();
        closeClue();
      });
      grid.appendChild(noneBtn);
    });

    clueStage.querySelector("#btnSkip").addEventListener("click", function(){
      markUsed(key);
      saveState();
      renderBoard();
      closeClue();
    });
  }

  function markUsed(key){ state.used[key] = true; }

    });

  document.getElementById("btnSound").addEventListener("click", function(){
    soundOn = !soundOn;
    this.textContent = soundOn ? "🔊 Sound On" : "🔇 Sound Off";
    this.setAttribute("aria-pressed", soundOn ? "true" : "false");
    if(soundOn) sfxSelect();
  });

  clueOverlay.addEventListener("click", function(e){
    if(e.target === clueOverlay){ /* require explicit close via buttons to avoid losing score step */ }
  });

  /* ---------------- Persistence ---------------- */
  function saveState(){ storageSafeSet("rt-jeopardy-state", state); }
  function loadState(){
    var saved = storageSafeGet("rt-jeopardy-state");
    if(saved && saved.teams && saved.teams.length){
      state = saved;
    }
  }

  /* ---------------- Hot update support ---------------- */
  function snapshot(){ return state; }
  function boot(initial){
    if(initial) state = initial;
    else loadState();
    applySet(state.setId || "setA");

    renderScoreboard();
    renderBoard();

    if(state.started){
      setupOverlay.hidden = true;
    } else {
      teamCountChoice = state.teams.length || 2;
      setChoice = state.setId || "setA";
      renderSetPicker();
      renderNumTeams();
      renderSetupNames();
      setupOverlay.hidden = false;
    }
  }

  if(window.claude && window.claude.hot){
    window.claude.hot.snapshot(snapshot);
    if(window.claude.hot.ready){ window.claude.hot.ready(boot); }
    else { boot(window.claude.hot.data || null); }
  } else {
    boot(null);
  }

})();
</script>
